<!DOCTYPE html>
<html>
<head>
    <title>About</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f0f6ff;
            font-family: 'Inter', sans-serif;
            color: #1e3a5f;
        }
        .back-btn {
            background-color: #e6f1fb;
            color: #185fa5;
            border: none;
            border-radius: 8px;
            padding: 8px 18px;
            font-size: 0.9rem;
            font-weight: 500;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background-color 0.2s;
        }
        .back-btn:hover {
            background-color: #b5d4f4;
            color: #0c447c;
        }
        .about-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 2px 16px rgba(26, 86, 160, 0.09);
        }
        .about-card h1 {
            font-size: 1.7rem;
            font-weight: 600;
            color: #1a56a0;
            margin-bottom: 0.5rem;
        }
        .divider {
            border: none;
            border-top: 2px solid #e6f1fb;
            margin: 1.5rem 0;
        }
        .about-card p {
            color: #5a7a9f;
            line-height: 1.8;
            font-size: 0.97rem;
        }
        .about-card ul {
            padding-left: 0;
            list-style: none;
        }
        .about-card ul li {
            color: #1e3a5f;
            font-size: 0.95rem;
            padding: 8px 14px;
            margin-bottom: 8px;
            background-color: #f0f6ff;
            border-left: 3px solid #378add;
            border-radius: 0 8px 8px 0;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container mt-5 pb-5" style="max-width: 680px;">

    <a href="/" class="back-btn mb-4">
        ← Kembali
    </a>

    <div class="about-card mt-3">
        <h1>Tentang Aplikasi</h1>
        <p style="color: #378add; font-size: 0.85rem; font-weight: 500; margin-bottom: 0;">Platform blog berbasis Django</p>

        <hr class="divider">

        <p>
            Aplikasi ini merupakan website blog yang dibuat menggunakan framework Django.
        </p>

        <p style="font-weight: 500; color: #1a56a0; margin-bottom: 0.75rem;">Fitur:</p>

        <ul>
            <li>Landing Page Modern</li>
            <li>Pencarian Artikel</li>
            <li>Detail Artikel</li>
            <li>Upload Gambar Artikel</li>
            <li>Dashboard Admin</li>
            <li>CRUD Artikel</li>
        </ul>

        <h5>Pembuat</h5>

        <p>
            Khairun Nisa
        </p>
        
    </div>

</div>

</body>
</html>
