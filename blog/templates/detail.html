<!DOCTYPE html>
<html>
<head>
    <title>{{ article.title }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>

        body{
            background:#f0f6ff;
            font-family:'Inter',sans-serif;
            color:#1e3a5f;
        }

        .back-btn{
            background:#e6f1fb;
            color:#185fa5;
            border:none;
            border-radius:8px;
            padding:8px 18px;
            text-decoration:none;
            font-size:0.9rem;
            font-weight:500;
            display:inline-flex;
            align-items:center;
            gap:6px;
            transition:background-color 0.2s;
        }

        .back-btn:hover{
            background:#b5d4f4;
            color:#0c447c;
        }

        .article-card{
            background:white;
            border-radius:16px;
            padding:2rem;
            box-shadow:0 2px 16px rgba(26,86,160,.09);
        }

        .article-image{
            width:100%;
            border-radius:12px;
            margin-bottom:20px;
        }

    </style>

</head>
<body>

<div class="container mt-5 pb-5" style="max-width:800px;">

    <a href="/artikel/" class="back-btn">
        ← Kembali
    </a>

    <div class="article-card mt-4">

        {% if article.image %}
            <img
                src="{{ article.image.url }}"
                class="article-image"
            >
        {% endif %}

        <span
            style="
                background:#e6f1fb;
                color:#185fa5;
                padding:3px 10px;
                border-radius:20px;
                font-size:.75rem;
            "
        >
            Artikel
        </span>

        <h1 class="mt-3">
            {{ article.title }}
        </h1>

        <p style="color:#8aa8c8;">
            {{ article.created_at|date:"d M Y" }}
        </p>

        <hr>

        <p style="line-height:1.9;">
            {{ article.content }}
        </p>

    </div>

</div>

</body>
</html>
